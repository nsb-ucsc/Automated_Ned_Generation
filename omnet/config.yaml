# ---------------------------------------------------------------------------
# Complex Enterprise Network Configuration (CORRECTED VERSION)
#
# The 'connections' section has been updated to ensure that for simple,
# one-way data flows, connection arrows always point TOWARDS sink nodes
# and AWAY from source nodes.
# ---------------------------------------------------------------------------

simulation:
  name: EnterpriseWANExample
  duration: 120 # seconds
  display: "bgb=1600,1200" # A large canvas for a complex network

nodes:
  # --- Headquarters (HQ) Nodes ---
  - name: hq_router
    role: router
    display: "p=400,300;is=vl"
    interfaces:
      - { name: wifi0, type: wifi }
      - { name: lan0, type: p2p }
      - { name: wan0, type: p2p } # To Branch Office
      - { name: wan1, type: p2p } # To Data Center

  - name: ceo_workstation
    role: source
    display: "p=150,200;is=l"
    interfaces:
      - { name: wlan0, type: wifi }

  - name: finance_pc
    role: source
    display: "p=150,400;is=l"
    interfaces:
      - { name: eth0, type: p2p }

  # --- Branch Office Nodes ---
  - name: branch_router
    role: router
    display: "p=1200,300;is=vl"
    interfaces:
      - { name: wifi0, type: wifi }
      - { name: lan0, type: p2p }
      - { name: wan0, type: p2p } # To HQ
      - { name: wan1, type: p2p } # To Data Center (redundant link)

  - name: sales_laptop
    role: source
    display: "p=1400,200;is=l"
    interfaces:
      - { name: wlan0, type: wifi }

  - name: branch_printer
    role: sink
    display: "p=1400,400;is=l"
    interfaces:
      - { name: eth0, type: p2p }

  # --- Data Center (DC) Nodes ---
  - name: dc_core_router
    role: router
    display: "p=800,800;is=vl"
    interfaces:
      - { name: wan0, type: p2p } # To HQ
      - { name: wan1, type: p2p } # To Branch Office
      - { name: lan0, type: p2p }
      - { name: lan1, type: p2p }

  - name: auth_server
    role: sink
    display: "p=650,950;is=l"
    interfaces:
      - { name: eth0, type: p2p }

  - name: backup_server
    role: sink
    display: "p=950,950;is=l"
    interfaces:
      - { name: eth0, type: p2p }

connections:
  # --- HQ LAN Connections (Sources are the starting point) ---
  - type: wifi
    endpoints: [{node: ceo_workstation, interface: wlan0}, {node: hq_router, interface: wifi0}]
  - type: p2p
    endpoints: [{node: finance_pc, interface: eth0}, {node: hq_router, interface: lan0}]

  # --- Branch Office LAN Connections (Source is the start, Sink is the end) ---
  - type: wifi
    endpoints: [{node: sales_laptop, interface: wlan0}, {node: branch_router, interface: wifi0}]
  # CORRECTED: The router is now the starting point of the connection to the sink.
  - type: p2p
    endpoints: [{node: branch_router, interface: lan0}, {node: branch_printer, interface: eth0}]

  # --- Data Center LAN Connections (Sinks are the end point) ---
  # CORRECTED: The router is now the starting point of the connection to the sinks.
  - type: p2p
    endpoints: [{node: dc_core_router, interface: lan0}, {node: auth_server, interface: eth0}]
    parameters: { datarate: "10Gbps", delay: "0.5ms" }
  - type: p2p
    endpoints: [{node: dc_core_router, interface: lan1}, {node: backup_server, interface: eth0}]
    parameters: { datarate: "10Gbps", delay: "0.5ms" }

  # --- WAN Backbone Links (Between routers, direction is a matter of preference) ---
  - type: p2p # HQ --> Branch
    endpoints: [{node: hq_router, interface: wan0}, {node: branch_router, interface: wan0}]
    parameters: { datarate: "100Mbps", delay: "20ms" }
  - type: p2p # HQ --> Data Center
    endpoints: [{node: hq_router, interface: wan1}, {node: dc_core_router, interface: wan0}]
    parameters: { datarate: "1Gbps", delay: "5ms" }
  - type: p2p # Branch --> Data Center (Redundant Link)
    endpoints: [{node: branch_router, interface: wan1}, {node: dc_core_router, interface: wan1}]
    parameters: { datarate: "100Mbps", delay: "25ms" }