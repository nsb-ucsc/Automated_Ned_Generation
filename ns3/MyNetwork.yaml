# ------------------------------------------------------------
#  SAMPLE CONFIG – edit freely or clone for new experiments
# ------------------------------------------------------------
sim_name: DemoNet
sim_time: 10               # seconds of simulated time

nodes:                     # every node must have a unique name
  - { name: sta1,   role: source, network: wifi }
  - { name: sta2,   role: source, network: wifi }
  - { name: ap,     role: relay,  network: wifi }
  - { name: server, role: sink,   network: p2p  }

links:                     # each item connects *two* endpoints
  # Wi-Fi: sta1  <-->  ap
  - { src: sta1,     dest: ap,    type: wifi }
  # Wi-Fi: sta2  <-->  ap
  - { src: sta2,     dest: ap,    type: wifi }

  # P2P backbone: ap  <-->  server
  - { src: ap,       dest: server, type: p2p,
      data_rate: 50Mbps, delay: 1ms }

traffic:                   # optional – otherwise auto-apps by role
  - { src: sta1, dest: server, protocol: udp,
      rate: 1Mbps, pkt_size: 1024 }
  - { src: sta2, dest: server, protocol: udp,
      rate: 2Mbps, pkt_size: 1024 }
